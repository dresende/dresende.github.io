<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0c0d12; color: #e9f5fa; text-align: center; padding: 24px; }
  a { color: #38bdf8; }
</style>
</head>
<body>
  <main id="m"><h1>Moved</h1><p>These pages now live on their own domains.</p></main>
  <script>
    // /<app>/<rest> -> https://<app>.dresende.pt/<rest>, for the apps that
    // ever lived here. Anything else is left alone: a wrong guess would
    // send someone to a domain that does not exist.
    (function () {
      var apps = ["kirjo", "sikku", "helmi", "tulos", "mittari", "cruzadas", "pilvi", "talo"];
      var parts = location.pathname.split("/").filter(Boolean);
      if (parts.length && apps.indexOf(parts[0]) !== -1) {
        var rest = parts.slice(1).join("/");
        location.replace("https://" + parts[0] + ".dresende.pt/" + rest
                         + location.search + location.hash);
      }
    })();
  </script>
</body>
</html>
