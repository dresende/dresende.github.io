<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kirjo has moved</title>
<link rel="canonical" href="https://kirjo.dresende.pt/privacy.html">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://kirjo.dresende.pt/privacy.html">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0c0d12; color: #e9f5fa; text-align: center; padding: 24px; }
  a { color: #38bdf8; }
</style>
</head>
<body>
  <main>
    <h1>Kirjo has moved</h1>
    <p>This page now lives at<br><a href="https://kirjo.dresende.pt/privacy.html">https://kirjo.dresende.pt/privacy.html</a></p>
  </main>
  <script>
    // Carries the rest of the path and any query along, so a deep link
    // that was never enumerated still lands somewhere sensible.
    (function () {
      var rest = location.pathname.replace(/^\/kirjo\/?/, "");
      location.replace("https://kirjo.dresende.pt/" + rest + location.search + location.hash);
    })();
  </script>
</body>
</html>
